<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vitória no Puzzle — Pedrão</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="vitoria-puzzle">
    <div class="ticker">
      <span
        >PUZZLE CONCLUÍDO ⚠ ARQUIVO DE FOTOS LIBERADO ⚠ VITÓRIA CONFIRMADA
        ⚠</span
      >
    </div>
    <header class="cabecalho compacto">
      <h1 class="derrota">PASSADO</h1>
      <a class="pedrao" href="index.html">PEDRÃO</a>
      <h1 class="vitoria">VITÓRIA</h1>
    </header>
    <main class="painel">
      <section class="vitoria-puzzle">
        <p class="carimbo">PUZZLE CONCLUÍDO</p>
        <h2>VITÓRIA!</h2>
        <p>
          Memória aprovada e interrogatório sobrevivido. O arquivo de fotos foi
          liberado.
        </p>
        <div class="carrossel" aria-label="Carrossel de fotos da vitória">
          <button
            id="fotoAnterior"
            class="controle-carrossel anterior"
            type="button"
            aria-label="Foto anterior"
          >
            ‹
          </button>
          <div class="trilho-carrossel">
            <img
              class="foto-carrossel ativa"
              src="assets/IMG-20260830-WA0065.jpg"
              alt="Foto da vitória 1"
            /><img
              class="foto-carrossel"
              src="assets/IMG-20260830-WA0077.jpg"
              alt="Foto da vitória 2"
            /><img
              class="foto-carrossel"
              src="assets/tropatoda.png"
              alt="Foto da vitória 3"
            /><img
              class="foto-carrossel"
              src="assets/ex.jpeg"
              alt="Foto da vitória 4"
            /><img
              class="foto-carrossel"
              src="assets/IMG-20260831-WA0015.jpg"
              alt="Foto da vitória 5"
            /><img
              class="foto-carrossel"
              src="assets/oscarguindaste.jpg"
              alt="Foto da vitória 6"
            /><img
              class="foto-carrossel"
              src="assets/IMG-20260831-WA0020.jpg"
              alt="Foto da vitória 7"
            /><img
              class="foto-carrossel"
              src="assets/unnamed.jpg"
              alt="Foto da vitória 8"
            />
          </div>
          <button
            id="proximaFoto"
            class="controle-carrossel proxima"
            type="button"
            aria-label="Próxima foto"
          >
            ›
          </button>
        </div>
        <div id="indicadoresCarrossel" class="indicadores-carrossel"></div>
        <p id="contadorCarrossel" class="contador-carrossel">1 / 8</p>
        <div class="acoes-vitoria">
          <a class="botao-principal" href="index.html">VOLTAR AO HUB</a
          ><a class="botao-principal" href="desafios.html">JOGAR NOVAMENTE</a>
        </div>
      </section>
    </main>
    <script src="js/desafios.js"></script>
  </body>
</html>
