<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perícia de IMC — Pedrão</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="imc">
    <div class="ticker"><span>FASE 1 DE 3 ⚠ BALANÇA SEM CALIBRAÇÃO ⚠ RESULTADO 100% SUSPEITO ⚠</span></div>
    <header class="cabecalho compacto"><h1 class="derrota">DERROTA</h1><a class="pedrao" href="index.html">PEDRÃO</a><h1 class="vitoria">VITÓRIA</h1></header>
    <main class="painel">
        <section class="formulario-imc caixa-torta">
            <p class="etapa">FASE 1/3 — PERÍCIA CORPORAL AFETIVA</p>
            <h2>CALCULADORA DE IMC<br><small>Índice de Más Companhias</small></h2>
            <p>Preencha dados totalmente relevantes para sua vida amorosa.</p>
            <div class="campo"><label for="peso">Peso da consciência (kg)</label><input type="number" id="peso" min="1" placeholder="ex.: 72" required></div>
            <div class="campo"><label for="altura">Altura das expectativas (m)</label><input type="number" id="altura" min="0.5" max="3" step="0.01" placeholder="ex.: 1,80" required></div>
            <button class="botao-principal" id="calcular" type="button">CALCULAR COM PRECISÃO DUVIDOSA</button>
            <div id="resultado" class="resultado" role="status" hidden></div>
            <a id="recorrer" class="botao-recurso" href="edits.html" hidden>RECORRER DA DECISÃO →</a>
        </section>
        <a class="voltar" href="index.html">← Avançar para trás</a>
    </main>
    <script src="js/imc.js"></script>
</body>
</html>
